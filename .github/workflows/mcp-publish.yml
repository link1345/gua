name: MCP npm Publish

on:
  push:
    tags:
      - "gua-v[0-9]*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish MCP packages to npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: pwsh
        run: .github/scripts/release-version-from-tag.ps1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Read WebMCP package version
        id: webmcp_version
        shell: bash
        run: node -e "console.log('version=' + require('./packages/webmcp/package.json').version)" >> "${GITHUB_OUTPUT}"

      - name: Read World Tools package version
        id: world_tools_version
        shell: bash
        run: node -e "console.log('version=' + require('./packages/world-tools/package.json').version)" >> "${GITHUB_OUTPUT}"

      - name: Check whether World Tools version is already published
        id: world_tools_npm_version
        shell: bash
        run: |
          package_name="gua-world-tools"
          package_version="${{ steps.world_tools_version.outputs.version }}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/${package_name}/${package_version}")"

          case "${status}" in
            200)
              echo "published=true" >> "${GITHUB_OUTPUT}"
              echo "${package_name}@${package_version} is already published; npm publish will be skipped."
              ;;
            404)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unexpected npm registry response for ${package_name}@${package_version}: HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: Check whether WebMCP version is already published
        id: webmcp_npm_version
        shell: bash
        run: |
          package_name="gua-webmcp"
          package_version="${{ steps.webmcp_version.outputs.version }}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/${package_name}/${package_version}")"

          case "${status}" in
            200)
              echo "published=true" >> "${GITHUB_OUTPUT}"
              echo "${package_name}@${package_version} is already published; npm publish will be skipped."
              ;;
            404)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unexpected npm registry response for ${package_name}@${package_version}: HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: Check whether npm version is already published
        id: npm_version
        shell: bash
        run: |
          package_name="gui-mcp"
          package_version="${{ steps.version.outputs.version }}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/${package_name}/${package_version}")"

          case "${status}" in
            200)
              echo "published=true" >> "${GITHUB_OUTPUT}"
              echo "${package_name}@${package_version} is already published; npm publish will be skipped."
              ;;
            404)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unexpected npm registry response for ${package_name}@${package_version}: HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Check
        run: |
          bun run --filter gua-world-tools check
          bun run --filter gua-world-tools test
          bun run --filter gua-webmcp check
          bun run --filter gua-webmcp test
          bun run --filter gui-mcp check

      - name: Build
        run: |
          bun run --filter gua-world-tools build
          bun run --filter gua-webmcp build
          bun run --filter gui-mcp build

      - name: Verify World Tools package contents
        working-directory: packages/world-tools
        run: npm pack --dry-run

      - name: Publish World Tools to npm
        if: steps.world_tools_npm_version.outputs.published != 'true'
        working-directory: packages/world-tools
        run: npm publish --access public --tag latest

      - name: Verify WebMCP package contents
        working-directory: packages/webmcp
        run: npm pack --dry-run

      - name: Publish WebMCP to npm
        if: steps.webmcp_npm_version.outputs.published != 'true'
        working-directory: packages/webmcp
        run: npm publish --access public --tag latest

      - name: Prepare publish package
        id: prepare
        shell: bash
        run: |
          package_version="${{ steps.version.outputs.version }}"
          publish_dir="${RUNNER_TEMP}/gui-mcp-package"

          rm -rf "${publish_dir}"
          mkdir -p "${publish_dir}/dist"
          cp packages/mcp/README.md "${publish_dir}/README.md"
          cp -R packages/mcp/dist/. "${publish_dir}/dist/"

          PACKAGE_VERSION="${package_version}" PUBLISH_DIR="${publish_dir}" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const packageJson = JSON.parse(fs.readFileSync("packages/mcp/package.json", "utf8"));
          packageJson.version = process.env.PACKAGE_VERSION;
          delete packageJson.scripts;
          delete packageJson.devDependencies;
          for (const section of ["dependencies", "optionalDependencies", "peerDependencies"]) {
            for (const [name, version] of Object.entries(packageJson[section] ?? {})) {
              if (String(version).startsWith("workspace:")) {
                throw new Error(`Published gui-mcp manifest retains workspace dependency ${name}@${version}`);
              }
            }
          }

          fs.writeFileSync(
            path.join(process.env.PUBLISH_DIR, "package.json"),
            `${JSON.stringify(packageJson, null, 2)}\n`,
          );
          NODE

          echo "publish_dir=${publish_dir}" >> "${GITHUB_OUTPUT}"

      - name: Verify package contents
        run: |
          cd "${{ steps.prepare.outputs.publish_dir }}"
          npm pack --dry-run

      - name: Publish to npm
        if: steps.npm_version.outputs.published != 'true'
        run: |
          cd "${{ steps.prepare.outputs.publish_dir }}"
          npm publish --access public --tag latest
