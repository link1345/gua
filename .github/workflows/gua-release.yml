name: Gua Release

on:
  push:
    tags:
      - "gua-v[0-9]*"

permissions:
  contents: write

concurrency:
  group: gua-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-assets:
    name: Build Windows release assets
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: pwsh
        run: .github/scripts/release-version-from-tag.ps1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web inspector
        run: bun run --filter @gua/inspector build

      - name: Build Tauri inspector
        run: bun run --filter @gua/inspector tauri:build

      - name: Configure Debug native build
        run: cmake --preset windows-msvc-debug "-DGUA_VERSION=${{ steps.version.outputs.version }}" "-DGUA_GODOT_PLUGIN_VERSION=${{ steps.version.outputs.version }}" "-DGUA_BUILD_ID=${{ github.sha }}"

      - name: Configure Release native build
        run: cmake --preset windows-msvc-release "-DGUA_VERSION=${{ steps.version.outputs.version }}" "-DGUA_GODOT_PLUGIN_VERSION=${{ steps.version.outputs.version }}" "-DGUA_BUILD_ID=${{ github.sha }}"

      - name: Verify injected release metadata and Godot configurations
        shell: pwsh
        run: |
          $expected = @{
            'build/windows-msvc-debug/CMakeCache.txt' = 'Debug'
            'build/windows-msvc-release/CMakeCache.txt' = 'Release'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $cache = Get-Content $entry.Key -Raw
            if ($cache -notmatch 'GUA_VERSION:STRING=${{ steps.version.outputs.version }}' -or
                $cache -notmatch 'GUA_GODOT_PLUGIN_VERSION:STRING=${{ steps.version.outputs.version }}' -or
                $cache -notmatch 'GUA_BUILD_ID:STRING=${{ github.sha }}' -or
                $cache -notmatch "GUA_GODOT_CONFIGURATION:STRING=$($entry.Value)") {
              throw "Configured Gua metadata or Godot configuration is invalid: $($entry.Key)"
            }
          }

      - name: Build Debug and Release Godot GDExtensions
        run: |
          cmake --build --preset windows-msvc-debug --target gua-godot
          cmake --build --preset windows-msvc-release --target gua-godot

      - name: Verify Windows Godot addon contract
        shell: pwsh
        run: scripts/verify-godot-windows-addon.ps1 -RequireBinaries

      - name: Build Unity native plugins
        run: cmake --build --preset windows-msvc-release --target gua gua-runtime --config Release

      - name: Package release assets
        id: package
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "gua-release-assets"
          $godotRoot = Join-Path $env:RUNNER_TEMP "gua-godot-plugin"
          $godotTarget = Join-Path $godotRoot "addons/gua"
          $version = '${{ steps.version.outputs.version }}'

          Remove-Item -Recurse -Force $assets, $godotRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $assets, $godotTarget, (Join-Path $godotTarget "bin") | Out-Null

          Copy-Item "examples/godot-gdscript/addons/gua/gua.gdextension" $godotTarget
          Copy-Item "examples/godot-gdscript/addons/gua/gua.gdextension.uid" $godotTarget
          Copy-Item "examples/godot-gdscript/addons/gua/gua_auto_adapter.gd" $godotTarget
          Copy-Item "examples/godot-gdscript/addons/gua/gua_webmcp_bridge.gd" $godotTarget
          Copy-Item "examples/godot-gdscript/addons/gua/plugin.cfg" $godotTarget
          Copy-Item "examples/godot-gdscript/addons/gua/plugin.gd" $godotTarget
          Copy-Item "examples/godot-gdscript/addons/gua/plugin.gd.uid" $godotTarget
          Copy-Item "examples/godot-gdscript/addons/gua/bin/*.dll" (Join-Path $godotTarget "bin")

          Compress-Archive -Path (Join-Path $godotRoot "addons") -DestinationPath (Join-Path $assets "gua-godot-plugin-windows-v$version.zip") -CompressionLevel Optimal

          Copy-Item "packages/inspector/src-tauri/target/release/bundle" (Join-Path $assets "inspector") -Recurse
          "assets=$assets" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gua-release-v${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.assets }}
          if-no-files-found: error

      - name: Upload Unity native plugins
        uses: actions/upload-artifact@v4
        with:
          name: gua-unity-native-v${{ steps.version.outputs.version }}
          path: |
            build/windows-msvc-release/native/gua-core/Release/gua.dll
            build/windows-msvc-release/native/gua-runtime/Release/gua_runtime.dll
          if-no-files-found: error

  web-native:
    name: Build browser native assets
    needs: windows-assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.20
          actions-cache-folder: emsdk-cache

      - name: Build Debug Godot Web extension
        shell: pwsh
        run: scripts/build-web-native.ps1 -Configuration Debug -Version '${{ needs.windows-assets.outputs.version }}' -BuildId '${{ github.sha }}'

      - name: Build Release Godot Web extension and Unity WebGL runtime
        shell: pwsh
        run: scripts/build-web-native.ps1 -Configuration Release -Version '${{ needs.windows-assets.outputs.version }}' -BuildId '${{ github.sha }}'

      - name: Verify Godot Web addon contract
        shell: pwsh
        run: scripts/verify-godot-web-addon.ps1 -RequireBinaries

      - name: Package browser native assets
        shell: pwsh
        run: |
          $root = "artifacts/web-native"
          $godot = Join-Path $root "gua-godot-plugin-web/addons/gua"
          New-Item -ItemType Directory -Force (Join-Path $root "unity"), (Join-Path $godot "bin") | Out-Null
          Copy-Item "build/web-release/native/gua-runtime/libgua_runtime.a" (Join-Path $root "unity")
          Copy-Item "build/web-release/native/gua-core/libgua-core.a" (Join-Path $root "unity")
          Copy-Item "examples/godot-gdscript/addons/gua/gua.gdextension" $godot
          Copy-Item "examples/godot-gdscript/addons/gua/gua.gdextension.uid" $godot
          Copy-Item "examples/godot-gdscript/addons/gua/gua_auto_adapter.gd" $godot
          Copy-Item "examples/godot-gdscript/addons/gua/gua_webmcp_bridge.gd" $godot
          Copy-Item "examples/godot-gdscript/addons/gua/plugin.cfg" $godot
          Copy-Item "examples/godot-gdscript/addons/gua/plugin.gd" $godot
          Copy-Item "examples/godot-gdscript/addons/gua/plugin.gd.uid" $godot
          Copy-Item "examples/godot-gdscript/addons/gua/bin/gua_godot.web.debug.wasm32.wasm" (Join-Path $godot "bin")
          Copy-Item "examples/godot-gdscript/addons/gua/bin/gua_godot.web.release.wasm32.wasm" (Join-Path $godot "bin")
          scripts/verify-godot-web-addon.ps1 -AddonDirectory $godot -RequireBinaries
          Compress-Archive -Path (Join-Path $root "gua-godot-plugin-web/addons") -DestinationPath (Join-Path $root "gua-godot-plugin-web-v${{ needs.windows-assets.outputs.version }}.zip")

      - name: Upload browser native assets
        uses: actions/upload-artifact@v4
        with:
          name: gua-web-native-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/web-native
          if-no-files-found: error

  unity-package:
    name: Build Unity UPM package
    needs:
      - windows-assets
      - web-native
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Unity native plugins
        uses: actions/download-artifact@v4
        with:
          name: gua-unity-native-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/unity-native

      - name: Download Web native plugins
        uses: actions/download-artifact@v4
        with:
          name: gua-web-native-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/web-native

      - name: Prepare Unity project package dependencies
        shell: pwsh
        run: scripts/prepare-unity-package-ci.ps1 -Version '${{ needs.windows-assets.outputs.version }}' -NativeDirectory artifacts/unity-native

      - name: Verify Unity CI credentials
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          $missing = @('UNITY_LICENSE', 'UNITY_EMAIL', 'UNITY_PASSWORD') | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Unity UPM release requires these release-environment secrets: $($missing -join ', ')."
          }

      - name: Compile Unity package assemblies
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.3f1
          projectPath: examples/unity-smoke
          targetPlatform: StandaloneWindows64
          buildMethod: Gua.Unity.Editor.GuaUnityEditorCommands.BuildPlayer
          customParameters: -guaScene Assets/Scenes/GuaUnityFixture.unity -guaOutput /github/workspace/artifacts/unity-ci-player/GuaUnitySmoke.exe
          allowDirtyBuild: true

      - name: Package Unity UPM archive
        shell: pwsh
        run: scripts/package-unity-upm-ci.ps1 -Version '${{ needs.windows-assets.outputs.version }}' -OutputDirectory artifacts/unity-release -WebNativeDirectory artifacts/web-native

      - name: Upload Unity UPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: gua-unity-upm-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/unity-release/com.link1345.gua-${{ needs.windows-assets.outputs.version }}.tgz
          if-no-files-found: error

  publish:
    name: Publish Gua release
    needs:
      - windows-assets
      - unity-package
      - web-native
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: gua-release-v${{ needs.windows-assets.outputs.version }}
          path: release-assets

      - name: Download Unity UPM package
        uses: actions/download-artifact@v4
        with:
          name: gua-unity-upm-v${{ needs.windows-assets.outputs.version }}
          path: release-assets/unity

      - name: Download Web native assets
        uses: actions/download-artifact@v4
        with:
          name: gua-web-native-v${{ needs.windows-assets.outputs.version }}
          path: release-assets/web

      - name: Package public GitHub Release assets
        shell: pwsh
        run: |
          scripts/package-github-release-assets.ps1 `
            -Version '${{ needs.windows-assets.outputs.version }}' `
            -WindowsAssetsDirectory release-assets `
            -WebNativeDirectory release-assets/web `
            -UnityPackageDirectory release-assets/unity `
            -OutputDirectory publish-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.windows-assets.outputs.tag }}
          name: Gua v${{ needs.windows-assets.outputs.version }}
          body: |
            Automated Gua release build from `${{ github.sha }}`.

            This release contains the Windows Inspector installers, one Godot addon archive with Windows and Web GDExtensions, and the Unity Package Manager archive for Unity 6000.5+ with Windows x64 Mono and experimental WebGL native runtimes.
          files: publish-assets/*
          fail_on_unmatched_files: true
